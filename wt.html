<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>WT 檢視</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="wt.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WT">
<link rel="apple-touch-icon" href="wt-icon-192.png">
<link rel="icon" href="wt-icon-192.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body { background: #f2f4f4; color: #1f2937;
  font: 16px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding-bottom: 40px; }
header { position: sticky; top: 0; z-index: 10; background: #0f766e; color: #fff;
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
  display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 17px; margin: 0; flex: none; font-weight: 700; }
header .meta { flex: 1; font-size: 14px; font-weight: 600; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; }
header .meta .stale { color: #ffd9a8; font-weight: 700; }
header button { flex: none; border: 1px solid rgba(255,255,255,.55); background: none;
  color: #fff; border-radius: 8px; font-size: 14.5px; font-weight: 600;
  padding: 6px 12px; cursor: pointer; }
header button.active { background: #fff; color: #0f766e; border-color: #fff; }
main { padding: 10px 12px; max-width: 980px; margin: 0 auto; }
.card { background: #fff; border: 1px solid #d7dee2; border-radius: 10px;
  overflow: hidden; margin-bottom: 12px; }
.card .bar { background: #0f766e; color: #fff; padding: 7px 12px;
  font-size: 15.5px; font-weight: 700; overflow-wrap: anywhere; }
.card .sec { padding: 8px 12px; border-top: 1px dashed #e2e8ec; }
.card .sec .lab { font-size: 12px; font-weight: 700; color: #7c8b98;
  letter-spacing: .08em; margin-bottom: 2px; }
.card .sec .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.card .sec.todo .txt { color: #0f766e; font-weight: 500; }
/* 查房清單檢視(預設):綠條＋筆記/待辦,點綠條跳該床詳細頁 */
.lcard { background: #fff; border: 1px solid #d7dee2; border-radius: 10px;
  overflow: hidden; margin-bottom: 10px; }
.lcard .bar { background: #0f766e; color: #fff; padding: 8px 12px;
  font-size: 15.5px; font-weight: 700; overflow-wrap: anywhere; cursor: pointer;
  display: flex; align-items: baseline; gap: 8px; }
.lcard .bar:active { background: #0c5f59; }
.lcard .bar .go { font-size: 13px; font-weight: 400; opacity: .75; flex: none; }
/* 病人條上的「藥」小鈕 */
.medbtn { margin-left: auto; flex: none; border: 1px solid rgba(255,255,255,.6); background: none;
  color: #fff; border-radius: 8px; font-size: 13.5px; font-weight: 600; padding: 2px 11px;
  cursor: pointer; align-self: center; }
.medbtn:active { background: rgba(255,255,255,.25); }
.lcard .lbody { padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere;
  font-size: 15px; }
.lcard .lbody .todo-t { color: #0f766e; font-weight: 500; }
.lcard .lbody .empty-t { color: #9aa7b4; }
/* 今日新增內容(與昨天最後版本比對):橘紅色 */
.new-t { color: #c2410c; }
/* 藥物檢視:新增/變更=藍,移除=紅+刪除線 */
.med-add { color: #1d4ed8; font-weight: 600; }
.med-del { color: #b3402f; text-decoration: line-through; }
.card .sec.meds .txt { font-variant-numeric: tabular-nums; }
/* Assessment 預設收合,點標題展開 */
.sec.collapsible .lab { cursor: pointer; user-select: none; -webkit-user-select: none; }
.sec.collapsible:not(.open) .txt { display: none; }
/* 處置與狀況｜待辦 並排列 */
.pairrow { display: flex; align-items: stretch; }
.pairrow .sec.half { flex: 1; min-width: 0; }
.pairrow .sec.half + .sec.half { border-left: 1px dashed #e2e8ec; }
.pairrow .sec.half.todo .txt { color: #0f766e; font-weight: 500; }
.empty-t { color: #9aa7b4; }
.newbadge { background: #fff; color: #c2410c; font-size: 12px; font-weight: 700;
  border-radius: 8px; padding: 1px 7px; flex: none; align-self: center; }
.state { text-align: center; color: #7c8b98; padding: 60px 20px; font-size: 15px; }
.state button { display: block; margin: 18px auto 0; border: 0; border-radius: 8px;
  background: #0f766e; color: #fff; font-size: 16px; font-weight: 700;
  padding: 11px 22px; cursor: pointer; }
/* 設定畫面 */
#setup { padding: 40px 24px; max-width: 560px; margin: 0 auto; display: none; }
#setup h2 { font-size: 18px; }
#setup p { font-size: 14px; color: #5a6b7c; }
#setup input { width: 100%; font-size: 15px; padding: 11px; border: 1px solid #c8d2d8;
  border-radius: 8px; outline: none; }
#setup input:focus { border-color: #0f766e; }
#setup button { margin-top: 14px; border: 0; border-radius: 8px; background: #0f766e;
  color: #fff; font-size: 16px; font-weight: 700; padding: 11px 22px; cursor: pointer; }
/* 主治篩選選單 */
#filterMenu { position: fixed; top: calc(44px + env(safe-area-inset-top)); right: 10px;
  z-index: 20; background: #fff; border: 1px solid #cdd6db; border-radius: 10px;
  box-shadow: 0 6px 22px rgba(0,0,0,.18); min-width: 210px; display: none;
  max-height: 65vh; overflow: auto; }
#filterMenu.open { display: block; }
#filterMenu button { display: flex; justify-content: space-between; gap: 14px;
  width: 100%; border: 0; background: none; text-align: left; font-size: 15.5px;
  padding: 11px 16px; cursor: pointer; color: #1f2937; }
#filterMenu button + button { border-top: 1px solid #eef2f4; }
#filterMenu button.sel { color: #0f766e; font-weight: 700; }
#filterMenu button .n { color: #8a97a5; font-variant-numeric: tabular-nums; }
/* ── 手機緊湊版(窄螢幕自動套用;平板維持原排版) ── */
@media (max-width: 600px){
  body { font-size: 14px; }
  header { padding: calc(6px + env(safe-area-inset-top)) 10px 6px; gap: 7px; }
  header h1 { font-size: 15px; }
  header .meta { font-size: 12px; }
  header button { font-size: 12.5px; padding: 4px 9px; border-radius: 7px; }
  main { padding: 8px 8px; }
  .lcard, .card { border-radius: 8px; margin-bottom: 8px; }
  .lcard .bar, .card .bar { font-size: 12.5px; padding: 6px 9px; gap: 6px; }
  .lcard .bar .go { display: none; }         /* 手機省空間,點綠條即詳細 */
  .lcard .lbody { font-size: 13px; line-height: 1.5; padding: 6px 9px; }
  .card .sec { padding: 6px 9px; }
  .card .sec .lab { font-size: 10.5px; }
  .card .sec .txt { font-size: 13px; line-height: 1.5; }
  .medbtn { font-size: 12px; padding: 1px 8px; }
  .newbadge { font-size: 10.5px; padding: 0 5px; }
  .state { font-size: 14px; padding: 40px 16px; }
  #filterMenu { top: calc(38px + env(safe-area-inset-top)); }
  #filterMenu button { font-size: 14px; padding: 9px 14px; }
}
</style>
</head>
<body>

<header>
  <button id="backBtn" style="display:none" aria-label="上一頁">‹ 返回</button>
  <h1>WT</h1>
  <span class="meta" id="meta">載入中…</span>
  <button id="reloadBtn" aria-label="重新整理">↻</button>
  <button id="viewBtn">詳細</button>
  <button id="filterBtn">全部</button>
</header>
<div id="filterMenu"></div>
<main id="main"><div class="state">載入中…</div></main>

<div id="setup">
  <h2>第一次使用：連上中繼站</h2>
  <p>貼上你的雲端中繼網址（含 secret，跟床邊待辦「雲端中繼網址」欄同一串）。只存在這台裝置。</p>
  <input id="setupUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec?secret=…"
         autocapitalize="off" autocorrect="off">
  <button id="setupSave">開始使用</button>
</div>

<script>
const RELAY_KEY = 'bedside-relay-url';        // 與床邊待辦共用同一把鑰匙
const FILTER_KEY = 'wtview-attending';
const CACHE_KEY = 'wtview-cache';
const mainEl = document.getElementById('main');
const metaEl = document.getElementById('meta');
const filterBtn = document.getElementById('filterBtn');
const filterMenu = document.getElementById('filterMenu');
let data = null;       // {patients:[...], generatedAt}
let lastNonce = '';

function relayUrl(){
  return (localStorage.getItem(RELAY_KEY)||'')
    .replace(/：/g,':').replace(/／/g,'/').replace(/。/g,'.').replace(/？/g,'?').replace(/＝/g,'=')
    .replace(/\s+/g,'');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtLines(p, key){
  // 逐行輸出,今日新增的行(added[key] 索引)包橘紅 span;整段空白回傳空字串
  const raw = p[key]||'';
  if(!raw.trim()) return '';
  const addedIdx = new Set((p.added && p.added[key]) || []);
  return raw.split('\n')
    .map((line,i)=> addedIdx.has(i) ? '<span class="new-t">'+esc(line)+'</span>' : esc(line))
    .join('\n').replace(/^\n+|\n+$/g,'');
}
function barBadge(p){ return p.isNew ? '<span class="newbadge">新</span>' : ''; }
function shortTime(generatedAt){
  // "2026/08/24 10:05" → "8/24 10:05"(一律帶日期)
  const m = String(generatedAt||'').match(/^(\d{4})\/(\d{2})\/(\d{2}) (\d{2}:\d{2})$/);
  if(!m) return generatedAt||'';
  return (+m[2])+'/'+(+m[3])+' '+m[4];
}

async function decryptPayload(cipher, secret){
  const parts = cipher.split('.');
  const keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(secret));
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const iv = Uint8Array.from(atob(parts[0]), c=>c.charCodeAt(0));
  const ct = Uint8Array.from(atob(parts[1]), c=>c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}

async function load(manual){
  const relay = relayUrl();
  if(!relay){
    document.getElementById('setup').style.display = 'block';
    mainEl.style.display = 'none';
    return;
  }
  if(manual) metaEl.textContent = '更新中…';
  try{
    const u = new URL(relay);
    const secret = u.searchParams.get('secret')||'';
    const res = await fetch(u.origin+u.pathname+'?action=wt&secret='+encodeURIComponent(secret));
    const box = await res.json();
    if(!box.cipher){ mainEl.innerHTML = '<div class="state">中繼站還沒有 WT 資料。<br>確認 Mac 醒著、WT 開著,一分鐘後再試。</div>'; metaEl.textContent=''; return; }
    if(box.nonce === lastNonce && !manual) return;  // 沒新版就不重繪
    data = await decryptPayload(box.cipher, secret);
    lastNonce = box.nonce;
    // 快取到本機:下次冷啟動(或離線)秒開上次內容
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({data, nonce: box.nonce})); }catch(e){}
    render();
  }catch(e){
    if(!data){
      mainEl.innerHTML = '<div class="state">連不到中繼站,或密鑰不對。<br><button onclick="resetSetup()">重新設定網址</button></div>';
      metaEl.textContent = '';
    }else{
      metaEl.innerHTML = '更新 ' + esc(shortTime(data.generatedAt)) + ' <span class="stale">· 離線</span>';
    }
  }
}
function resetSetup(){ localStorage.removeItem(RELAY_KEY); location.reload(); }

function attendings(){
  const count = {};
  (data.patients||[]).forEach(p=>{ count[p.attending] = (count[p.attending]||0)+1; });
  return Object.entries(count).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'));
}

let view = 'list';          // list=查房清單(預設) / detail=全部詳細 / meds=藥物 / patient=單一病人
let pendingScroll = null;   // (detail 檢視保留的捲動位置機制)
let selectedKey = null;     // patient 檢視鎖定的病人(病歷號)
const navStack = [];        // 「上一頁」歷史

function keyOf(p){ const m = String(p.info||'').match(/\b(\d{7})\b/); return m ? m[1] : p.info; }
function updateBackBtn(){ document.getElementById('backBtn').style.display = navStack.length ? '' : 'none'; }
function navigate(nextView, key){
  navStack.push({view, selectedKey});
  if(navStack.length > 50) navStack.shift();
  view = nextView;
  if(key !== undefined) selectedKey = key;
  render(); window.scrollTo(0, 0); updateBackBtn();
}
function goBack(){
  const prev = navStack.pop();
  if(!prev) return;
  view = prev.view; selectedKey = prev.selectedKey;
  render(); window.scrollTo(0, 0); updateBackBtn();
}

function render(){
  if(!data) return;
  const sel = localStorage.getItem(FILTER_KEY) || '';
  const list = (data.patients||[]).filter(p=>!sel || p.attending===sel);
  filterBtn.textContent = sel || '全部';
  filterBtn.className = sel ? 'active' : '';
  document.getElementById('viewBtn').textContent = view==='detail' ? '清單' : '詳細';
  metaEl.innerHTML = '更新 ' + esc(shortTime(data.generatedAt)) + ' · ' + list.length + ' 床';
  if(!list.length){
    mainEl.innerHTML = '<div class="state">'+(sel ? '「'+esc(sel)+'」目前沒有病人' : '沒有病人資料')+'</div>';
    return;
  }
  if(view==='patient' || view==='pmeds'){
    const p = (data.patients||[]).find(x=>keyOf(x)===selectedKey);
    if(p){ (view==='patient' ? renderPatientView : renderPatientMedsView)(p); return; }
    view = 'list';  // 病人已不在名單(出院等) → 退回清單
  }
  if(view==='list') renderListView(list);
  else renderDetailView(list);
  if(pendingScroll !== null){
    const el = document.getElementById('p'+pendingScroll);
    if(el) el.scrollIntoView({block:'start'});
    pendingScroll = null;
  }
}

function renderListView(list){
  mainEl.innerHTML = list.map((p,i)=>{
    const note = fmtLines(p,'note');
    const todo = fmtLines(p,'todo');
    let body = '';
    if(note) body += note;
    if(todo) body += (body?'\n':'') + '<span class="todo-t">'+todo+'</span>';
    if(!body) body = '<span class="empty-t">（筆記欄空白）</span>';
    return '<div class="lcard"><div class="bar" data-i="'+i+'">'+esc(p.info)+barBadge(p)+
      '<button class="medbtn" data-m="'+i+'">藥</button><span class="go">詳細 ›</span></div><div class="lbody">'+body+'</div></div>';
  }).join('');
  mainEl.querySelectorAll('.bar[data-i]').forEach(bar=>{
    bar.onclick = ()=>navigate('patient', keyOf(list[+bar.dataset.i]));
  });
  bindMedButtons(list);
}

function detailSections(p){
  // 最上面:處置與狀況(左)｜待辦/待追蹤(右)並排,方便一眼報告;下面才是診斷(收合)/AS/PLAN
  const note = fmtLines(p,'note');
  const todo = fmtLines(p,'todo');
  let out = '';
  if(note || todo){
    out += '<div class="pairrow">'+
      '<div class="sec half"><div class="lab">處置與狀況</div><div class="txt">'+(note||'<span class="empty-t">—</span>')+'</div></div>'+
      '<div class="sec half todo"><div class="lab">待辦/待追蹤</div><div class="txt">'+(todo||'<span class="empty-t">—</span>')+'</div></div>'+
      '</div>';
  }
  const SECTIONS = [['dx','診斷'],['assessment','ASSESSMENT'],['plan','PLAN']];
  out += SECTIONS.map(([k,lab])=>{
    const html = fmtLines(p,k);
    if(!html) return '';
    if(k==='dx'){
      return '<div class="sec collapsible"><div class="lab">'+lab+' ▸</div><div class="txt">'+html+'</div></div>';
    }
    return '<div class="sec"><div class="lab">'+lab+'</div><div class="txt">'+html+'</div></div>';
  }).join('');
  return out;
}
function bindCollapsibles(){
  mainEl.querySelectorAll('.sec.collapsible .lab').forEach(lab=>{
    lab.onclick = ()=>{
      const sec = lab.parentElement;
      sec.classList.toggle('open');
      lab.textContent = '診斷 ' + (sec.classList.contains('open') ? '▾' : '▸');
    };
  });
}
function bindMedButtons(list){
  mainEl.querySelectorAll('.medbtn[data-m]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();  // 別觸發病人條本身的點擊
      navigate('pmeds', keyOf(list[+btn.dataset.m]));
    };
  });
}
function renderDetailView(list){
  mainEl.innerHTML = list.map((p,i)=>
    '<div class="card" id="p'+i+'"><div class="bar" style="display:flex;gap:8px">'+esc(p.info)+barBadge(p)+
    '<button class="medbtn" data-m="'+i+'">藥</button></div>'+detailSections(p)+'</div>'
  ).join('');
  bindCollapsibles();
  bindMedButtons(list);
}
function renderPatientMedsView(p){
  // 單一病人藥物頁:目前藥物＋藥物變更(標色同全域規則)
  const meds = (p.meds||'').trim();
  const change = (p.medChange||'').trim();
  let secs = '';
  if(meds) secs += '<div class="sec meds"><div class="lab">目前藥物</div><div class="txt">'+medsHtml(p.meds, p.medChange)+'</div></div>';
  if(change) secs += '<div class="sec meds"><div class="lab">藥物變更</div><div class="txt">'+medChangeHtml(p.medChange)+'</div></div>';
  if(!secs) secs = '<div class="sec"><div class="txt" style="color:#9aa7b4">（無藥物資料）</div></div>';
  mainEl.innerHTML = '<div class="card"><div class="bar" style="display:flex;gap:8px">'+esc(p.info)+barBadge(p)+'</div>'+secs+'</div>';
}
function renderPatientView(p){
  // 單一病人頁:詳細內容＋該病人的藥物區塊
  let secs = detailSections(p);
  const meds = (p.meds||'').trim();
  const change = (p.medChange||'').trim();
  if(meds) secs += '<div class="sec meds"><div class="lab">目前藥物</div><div class="txt">'+medsHtml(p.meds, p.medChange)+'</div></div>';
  if(change) secs += '<div class="sec meds"><div class="lab">藥物變更</div><div class="txt">'+medChangeHtml(p.medChange)+'</div></div>';
  mainEl.innerHTML = '<div class="card"><div class="bar" style="display:flex;gap:8px">'+esc(p.info)+barBadge(p)+'</div>'+secs+'</div>';
  bindCollapsibles();
}

/* ── 藥物檢視:目前藥物＋藥物變更,新增/變更=藍、移除=紅刪除線 ── */
function medChangeHtml(text){
  return text.split('\n').map(line=>{
    const t = line.trim();
    if(t.startsWith('移除：')) return '<span class="med-del">'+esc(line)+'</span>';
    if(t.startsWith('新增：')||t.startsWith('變更：')) return '<span class="med-add">'+esc(line)+'</span>';
    return esc(line);
  }).join('\n').replace(/^\n+|\n+$/g,'');
}
function medsHtml(medsText, changeText){
  // 目前藥物清單裡,名字出現在「新增/變更」行的藥整行標藍
  const names = [];
  String(changeText||'').split('\n').forEach(l=>{
    const m = l.trim().match(/^(?:新增|變更)：\s*(\S+)/);
    if(m) names.push(m[1].split(/[（(]/)[0]);
  });
  return String(medsText||'').split('\n').map(line=>{
    const t = line.trim();
    const hit = t && names.some(n=>t.startsWith(n));
    return hit ? '<span class="med-add">'+esc(line)+'</span>' : esc(line);
  }).join('\n').replace(/^\n+|\n+$/g,'');
}

function renderFilterMenu(){
  const sel = localStorage.getItem(FILTER_KEY) || '';
  const total = (data && data.patients||[]).length;
  let html = '<button data-a="" class="'+(sel?'':'sel')+'">全部 <span class="n">'+total+'</span></button>';
  attendings().forEach(([name,n])=>{
    html += '<button data-a="'+esc(name)+'" class="'+(sel===name?'sel':'')+'">'+esc(name)+' <span class="n">'+n+'</span></button>';
  });
  filterMenu.innerHTML = html;
  filterMenu.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      localStorage.setItem(FILTER_KEY, b.dataset.a);
      filterMenu.classList.remove('open');
      render();
    };
  });
}

filterBtn.onclick = ()=>{
  if(!data) return;
  if(filterMenu.classList.contains('open')){ filterMenu.classList.remove('open'); return; }
  renderFilterMenu();
  filterMenu.classList.add('open');
};
document.addEventListener('click', (e)=>{
  if(!filterMenu.contains(e.target) && e.target!==filterBtn) filterMenu.classList.remove('open');
});
document.getElementById('reloadBtn').onclick = ()=>load(true);
document.getElementById('viewBtn').onclick = ()=>navigate(view==='detail' ? 'list' : 'detail');
document.getElementById('backBtn').onclick = goBack;
document.getElementById('setupSave').onclick = ()=>{
  const v = document.getElementById('setupUrl').value.trim();
  if(!v){ alert('請貼上中繼網址'); return; }
  localStorage.setItem(RELAY_KEY, v);
  location.reload();
};
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') load(false);
});
setInterval(()=>load(false), 90000);

// 冷啟動:先畫上次快取的內容(秒開),再抓最新
try{
  const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
  if(cached && cached.data && relayUrl()){
    data = cached.data;
    lastNonce = '';  // 保持空值,首次抓取必定重繪成最新版
    render();
  }
}catch(e){}
load(false);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js');
}
</script>
